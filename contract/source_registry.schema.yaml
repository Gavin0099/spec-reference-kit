$schema: "https://json-schema.org/draft/2020-12/schema"
title: Source Registry
type: object
required: [schema_version, sources]
properties:
  schema_version: {const: "0.1"}
  sources:
    type: array
    items:
      type: object
      required:
        - source_id
        - title
        - document_type
        - product_scope
        - revision
        - effective_date
        - locator
        - authority_level
        - classification
        - review_owner

